<!doctype html>
<html>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta http-equiv="Cache-Control" content="no-cache" />

    <!-- Disable zooming: -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <head>
        <!-- change this to your project name -->
        <title>RS IIIF Browser</title>

        <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
        
<script type="module">
import init, * as bindings from 'https://leungkkf.github.io/testbed/rs-iiif-browser-64e78f391661a4b6.js';
const wasm = await init({ module_or_path: 'https://leungkkf.github.io/testbed/rs-iiif-browser-64e78f391661a4b6_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
        <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
        <base href="https://leungkkf.github.io/testbed/" />

        <link rel="icon" href="https://leungkkf.github.io/testbed/favicon-6e17932928d1a05b.ico" integrity="sha384-atgBmlvF9r15jaHSkoWyzKZlPXWz6D+JhiN/RjVeVV2/1pgBsOBAUdnt6ahSrKvK"/>

        
        
        
        
        

        <link rel="manifest" href="manifest.json" />
        <link rel="apple-touch-icon" href="assets/icon_ios_touch_192.png" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="white"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#404040"
        />

        <style>
            html {
                /* Remove touch delay: */
                touch-action: manipulation;
            }

            body {
                /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
                background: #909090;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                    background: #404040;
                }
            }

            /* Allow canvas to fill entire web page: */
            html,
            body {
                overflow: hidden;
                margin: 0 !important;
                padding: 0 !important;
                height: 100%;
                width: 100%;
            }

            /* Make canvas fill entire document: */
            canvas {
                margin-right: auto;
                margin-left: auto;
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            .centered {
                margin-right: auto;
                margin-left: auto;
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #f0f0f0;
                font-size: 24px;
                font-family: Ubuntu-Light, Helvetica, sans-serif;
                text-align: center;
            }

            /* ---------------------------------------------- */
            /* Loading animation from https://loading.io/css/ */
            .lds-dual-ring {
                display: inline-block;
                width: 24px;
                height: 24px;
            }

            .lds-dual-ring:after {
                content: " ";
                display: block;
                width: 24px;
                height: 24px;
                margin: 0px;
                border-radius: 50%;
                border: 3px solid #fff;
                border-color: #fff transparent #fff transparent;
                animation: lds-dual-ring 1.2s linear infinite;
            }

            @keyframes lds-dual-ring {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    <link rel="modulepreload" href="https://leungkkf.github.io/testbed/rs-iiif-browser-64e78f391661a4b6.js" crossorigin="anonymous" integrity="sha384-8qzFGux23aAumsN25eJ7d3+u+jJc+rzlN/pyl0Eaml+4L70zxbrNhD43bsvaHsAJ"><link rel="preload" href="https://leungkkf.github.io/testbed/rs-iiif-browser-64e78f391661a4b6_bg.wasm" crossorigin="anonymous" integrity="sha384-DlyJYUTcTKk6eL0qePZbt+upM8F6fLV5oOkGSmnv0k/kdz50YSAS2Z0ZSl21Ms94" as="fetch" type="application/wasm"></head>

    <body>
        <!-- the loading spinner will be removed in main.rs -->
        <div class="centered" id="loading-screen">
            <noscript>You need javascript to use this website</noscript>
            <p style="font-size: 16px">Loading…</p>
            <div class="lds-dual-ring"></div>
        </div>

        <script type="module">
            // Hide loading screen when the game starts.
            const loading_screen = document.getElementById("loading-screen");
            const observer = new MutationObserver((records) => {
                for (const record of records) {
                    for (const addedNode of record.addedNodes) {
                        if (addedNode instanceof HTMLCanvasElement) {
                            // Prevent dragging the canvas
                            addedNode.addEventListener("dragstart", (event) => {
                                event.preventDefault();
                            });
                            // Prevent touch events for the canvas.
                            addedNode.addEventListener(
                                "touchstart",
                                (event) => {
                                    event.preventDefault();
                                },
                            );
                            // Prevent context menu events for the canvas.
                            addedNode.addEventListener(
                                "contextmenu",
                                (event) => {
                                    event.preventDefault();
                                },
                            );

                            if (addedNode.innerText.trim().length === 0) {
                                // Add compatibility note
                                addedNode.innerText =
                                    "Canvas support is required to run this app";
                            }

                            // A new canvas has been created, which means that the game has been loaded
                            // Hide the loading screen!
                            loading_screen.style.display = "none";
                            observer.disconnect();
                            return;
                        }
                    }
                }
            });

            observer.observe(document.body, {
                subtree: false,
                childList: true,
                attributes: false,
                characterData: false,
            });
        </script>
    </body>
</html>
